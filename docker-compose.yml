# Production-like Compose configuration for the Anketka monitor.
# Coolify supplies SERVICE_* values; TELEGRAM_TOKEN is configured as a secret.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-anketka}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?Set SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: anketka_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    environment:
      BLOCK: bot
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-anketka}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anketka_monitor
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Set TELEGRAM_TOKEN}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    profiles: ["collector"]
    build: .
    environment:
      BLOCK: collector
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-anketka}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anketka_monitor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
