<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151c">
  <title>Анкетка / Лента отзывов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --ink: #10151c;
      --ink-soft: #53606d;
      --paper: #f1f3ee;
      --card: #ffffff;
      --line: #d8ddd7;
      --accent: #ff5a36;
      --acid: #d9ff58;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Trebuchet MS", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 760px; margin: auto; min-height: 100vh; padding: 0 18px 48px; }
    .hero { margin: 0 -18px; padding: 26px 18px 22px; color: #fff; background: var(--ink); border-bottom: 4px solid var(--accent); }
    .eyebrow { margin: 0 0 15px; color: var(--acid); font: 11px/1.2 "Courier New", monospace; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 650px; font: 700 clamp(34px, 7vw, 58px)/.95 Georgia, serif; letter-spacing: -.045em; }
    .hero-meta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 24px; color: #bdc7cf; font: 12px "Courier New", monospace; text-transform: uppercase; }
    .hero-meta span { padding: 7px 9px; border: 1px solid #3e4954; border-radius: 99px; }
    .toolbar { position: sticky; top: 0; z-index: 5; margin: 0 -18px; padding: 12px 18px; background: color-mix(in srgb, var(--paper) 93%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--card); outline: none; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #ff5a3624; }
    .chips { display: flex; gap: 7px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 7px 11px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-soft); background: var(--card); font: 12px "Courier New", monospace; }
    .chip.active { color: var(--ink); border-color: var(--ink); background: var(--acid); }
    .feed { display: grid; gap: 12px; padding-top: 17px; }
    .card { position: relative; padding: 17px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: 0 9px 24px #10151c0b; animation: rise .4s both; }
    .card:nth-child(2) { animation-delay: 30ms; } .card:nth-child(3) { animation-delay: 60ms; } .card:nth-child(4) { animation-delay: 90ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .card-top, .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .source { color: var(--ink-soft); font: 11px "Courier New", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .date { color: var(--ink-soft); font: 11px "Courier New", monospace; }
    .new { padding: 4px 7px; color: var(--ink); border-radius: 99px; background: var(--acid); font: 10px "Courier New", monospace; text-transform: uppercase; }
    .rating { margin-top: 13px; color: var(--accent); letter-spacing: .08em; }
    .rating span.off { color: #d6dbd5; }
    .author { margin: 10px 0 0; font-size: 13px; color: var(--ink-soft); }
    .review-text { margin: 9px 0 0; font-size: 17px; line-height: 1.4; white-space: pre-wrap; }
    .response { margin-top: 14px; padding: 11px 12px; border-left: 3px solid var(--accent); background: #fff3ef; font-size: 13px; line-height: 1.45; }
    .response b { display: block; margin-bottom: 4px; font: 10px "Courier New", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .card-bottom { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
    .version { color: var(--ink-soft); font: 10px "Courier New", monospace; }
    .open { padding: 7px 10px; color: #fff; border: 0; border-radius: 8px; background: var(--ink); font-size: 12px; text-decoration: none; }
    .empty { padding: 52px 12px; text-align: center; color: var(--ink-soft); }
    .foot { margin-top: 22px; color: var(--ink-soft); text-align: center; font: 10px "Courier New", monospace; letter-spacing: .08em; text-transform: uppercase; }
    @media (min-width: 680px) { .shell { padding-left: 30px; padding-right: 30px; } .hero, .toolbar { margin-left: -30px; margin-right: -30px; padding-left: 30px; padding-right: 30px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Anketka / feedback monitor</p>
      <h1>Лента отзывов</h1>
      <div class="hero-meta"><span id="total">— отзывов</span><span id="updated">обновляется</span></div>
    </header>
    <section class="toolbar" aria-label="Фильтры">
      <input id="search" class="search" type="search" placeholder="Найти по тексту или имени…" autocomplete="off">
      <div class="chips" id="periods"></div>
      <div class="chips" id="ratings"></div>
    </section>
    <section id="feed" class="feed" aria-live="polite"></section>
    <p class="foot">RuStore · Анкетка · только чтение</p>
  </main>
  <script>
    const DATA = /*DATA*/null/*END*/;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const state = { period: 0, rating: 0, query: "" };
    const periods = [{ n: "Все", days: 0 }, { n: "7 дней", days: 7 }, { n: "30 дней", days: 30 }, { n: "90 дней", days: 90 }];
    const esc = (v) => String(v ?? "").replace(/[&<>\"]/g, (x) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[x]));
    const day = (v) => v ? new Date(v).toLocaleDateString("ru-RU", { day: "2-digit", month: "short", year: "numeric" }) : "дата не указана";
    const stars = (n) => [...Array(5)].map((_, i) => `<span class="${i < n ? "" : "off"}">★</span>`).join("");
    const within = (r) => !periods[state.period].days || (Date.now() - new Date(r.published_at || r.collected_at)) / 86400000 <= periods[state.period].days;
    const visible = () => DATA.reviews.filter((r) => within(r) && (!state.rating || r.rating === state.rating) && (!state.query || `${r.author} ${r.text}`.toLowerCase().includes(state.query.toLowerCase())));
    function renderFilters() {
      document.querySelector("#periods").innerHTML = periods.map((p, i) => `<button class="chip ${state.period === i ? "active" : ""}" data-period="${i}">${p.n}</button>`).join("");
      document.querySelector("#ratings").innerHTML = [{ n: "Все оценки", v: 0 }, ...[5,4,3,2,1].map((v) => ({ n: `${v} ★`, v }))].map((x) => `<button class="chip ${state.rating === x.v ? "active" : ""}" data-rating="${x.v}">${x.n}</button>`).join("");
    }
    function render() {
      renderFilters();
      const list = visible();
      document.querySelector("#feed").innerHTML = list.length ? list.map((r) => `
        <article class="card">
          <div class="card-top"><span class="source">${esc(r.source)}</span><span class="date">${day(r.published_at || r.collected_at)}</span>${r.is_new ? '<span class="new">новое</span>' : ""}</div>
          <div class="rating" aria-label="Оценка ${r.rating} из 5">${stars(r.rating)}</div>
          <p class="author">${esc(r.author)}</p>
          <p class="review-text">${esc(r.text)}</p>
          ${r.developer_response ? `<div class="response"><b>Ответ Анкетки</b>${esc(r.developer_response)}</div>` : ""}
          <div class="card-bottom"><span class="version">собрано ${day(r.collected_at)} · v${r.version}</span><a class="open" href="${esc(r.url)}" target="_blank" rel="noopener">Открыть отзыв</a></div>
        </article>`).join("") : '<div class="empty">По выбранным фильтрам отзывов нет.</div>';
      document.querySelector("#total").textContent = `${list.length} из ${DATA.totals.reviews} отзывов`;
      document.querySelector("#updated").textContent = DATA.generated_at ? `снимок ${day(DATA.generated_at)}` : "снимок готов";
    }
    document.addEventListener("click", (event) => {
      const p = event.target.closest("[data-period]"); if (p) { state.period = Number(p.dataset.period); render(); }
      const r = event.target.closest("[data-rating]"); if (r) { state.rating = Number(r.dataset.rating); render(); }
    });
    document.querySelector("#search").addEventListener("input", (e) => { state.query = e.target.value.trim(); render(); });
    render();
  </script>
</body>
</html>
