# Production-like Compose configuration for the Anketka monitor.
# Coolify supplies SERVICE_* values; TELEGRAM_TOKEN is configured as a secret.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-anketka}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?Set SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: anketka_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    environment:
      BLOCK: bot
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-anketka}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anketka_monitor
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Set TELEGRAM_TOKEN}
      FAQ_ADMIN_CHAT_IDS: ${FAQ_ADMIN_CHAT_IDS:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      ANALYTICS_ENDPOINT: ${ANALYTICS_ENDPOINT:-http://analytics_adapter:8090/analyze}
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}
      ANALYTICS_MODEL: ${ANALYTICS_MODEL:-}
      ANALYTICS_DRY_RUN: ${ANALYTICS_DRY_RUN:-false}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-unknown}
      ANALYTICS_PROMPT_VERSION: ${ANALYTICS_PROMPT_VERSION:-v4}
      ANALYTICS_TIMEOUT: ${ANALYTICS_TIMEOUT:-60}
      ANALYTICS_ATTEMPTS: ${ANALYTICS_ATTEMPTS:-3}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    profiles: ["collector"]
    build: .
    environment:
      BLOCK: collector
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-anketka}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anketka_monitor
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      FAQ_ADMIN_CHAT_IDS: ${FAQ_ADMIN_CHAT_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    build: .
    environment:
      BLOCK: analytics
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-anketka}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anketka_monitor
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      ANALYTICS_DRY_RUN: ${ANALYTICS_DRY_RUN:-false}
      ANALYTICS_INTERVAL_SECONDS: ${ANALYTICS_INTERVAL_SECONDS:-300}
      ANALYTICS_MAX_RUNS_PER_TICK: ${ANALYTICS_MAX_RUNS_PER_TICK:-1}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-unknown}
      ANALYTICS_ENDPOINT: ${ANALYTICS_ENDPOINT:-}
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}
      ANALYTICS_MODEL: ${ANALYTICS_MODEL:-}
      ANALYTICS_TIMEOUT: ${ANALYTICS_TIMEOUT:-30}
      ANALYTICS_ATTEMPTS: ${ANALYTICS_ATTEMPTS:-3}
      ANALYTICS_PROMPT_VERSION: ${ANALYTICS_PROMPT_VERSION:-v1}
    depends_on:
      postgres:
        condition: service_healthy

  analytics_adapter:
    build: .
    command: ["python", "-m", "analytics_adapter"]
    environment:
      ADAPTER_HOST: 0.0.0.0
      ADAPTER_PORT: 8090
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}
      ANALYTICS_MODEL: ${ANALYTICS_MODEL:-}
      OPENROUTER_ENDPOINT: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
    expose:
      - "8090"

  web:
    build: .
    expose:
      - "8080"
    environment:
      BLOCK: web
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-anketka}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anketka_monitor
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
